<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Büble Bier AR — prueba 1</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#101e19;color:white;font-family:system-ui,Arial,sans-serif}
    #top{position:fixed;z-index:10;top:0;left:0;right:0;padding:17px 15px;text-align:center;background:linear-gradient(#082116e8,#08211600);pointer-events:none}
    #top strong{display:block;font-size:19px;letter-spacing:.3px}#status{display:block;font-size:13px;margin-top:7px}
    #bottom{position:fixed;z-index:10;bottom:12px;left:12px;right:12px;text-align:center;font-size:12px;pointer-events:none;text-shadow:0 1px 3px black}
    a-scene{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="top"><strong>🍺 Büble Bier AR</strong><span id="status">Permite la cámara y enfoca la etiqueta</span></div>
  <div id="bottom">Prototipo gratuito · fase 1 · reconocimiento de imagen</div>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/etiqueta.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Este elemento animado está anclado al centro de la etiqueta. -->
      <a-ring position="0 0 .025" radius-inner=".17" radius-outer=".20" color="#ffe67b" opacity=".88"
        animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: 5000; easing: linear; loop: true"></a-ring>
      <a-circle position="0 0 .03" radius=".125" color="#ffbc37" opacity=".9"
        animation="property: scale; from: 1 1 1; to: 1.24 1.24 1; dir: alternate; dur: 750; easing: easeInOutSine; loop: true"></a-circle>
      <a-text value="AR" position="0 -.035 .05" align="center" color="#183c2a" width="1.2" font="mozillavr"></a-text>
      <a-text value="ETIQUETA DETECTADA" position="0 -.30 .045" align="center" color="#ffffff" width="1.55" side="double"></a-text>
    </a-entity>
  </a-scene>
  <script>
    const status = document.querySelector('#status');
    const target = document.querySelector('#target');
    target.addEventListener('targetFound', () => status.textContent = '✅ Etiqueta detectada: animación activada');
    target.addEventListener('targetLost', () => status.textContent = 'Etiqueta perdida: vuelve a enfocarla');
    document.querySelector('a-scene').addEventListener('arError', () => status.textContent = 'No se pudo iniciar AR. Revisa cámara, HTTPS y archivo .mind.');
  </script>
</body>
</html>
